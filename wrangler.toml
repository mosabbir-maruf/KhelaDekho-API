name = "kheladekho-api"
main = "worker/src/index.js"
compatibility_date = "2026-06-13"

[observability]
enabled = true

[triggers]
crons = ["*/1 * * * *"]  # warm-up every minute to prevent cold starts

assets = { directory = "worker/public", binding = "ASSETS" }

[vars]
V1_HOME_URL = "https://www.goal.com"
V2_HOME_URL = "https://kickbd.org"
V4_HOME_URL = "https://tv.proxybdix.com"
V5_HOME_URL = "https://dami-tv.pro"
