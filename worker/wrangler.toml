name = "kheladekho-api"
main = "src/index.js"
compatibility_date = "2026-06-13"

[observability]
enabled = true

[vars]
# Upstream base URLs (V1 = score provider, V2 = kickbd, V4 = proxybdix)
V1_HOME_URL = "https://www.goal.com"
V2_HOME_URL = "https://kickbd.org"
V4_HOME_URL = "https://tv.proxybdix.com"
V5_HOME_URL = "https://dami-tv.pro"
# Set ENVIRONMENT = "development" for verbose local logs (production stays silent)
# XKEY is set as a secret via Cloudflare Dashboard or `wrangler secret put XKEY`

# Bind a KV namespace for distributed rate limiting (optional)
# [[kv_namespaces]]
# binding = "KHELADEKHO_STORE"
# id = "your-kv-namespace-id"
