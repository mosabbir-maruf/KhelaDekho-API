name = "kheladekho-api"
main = "src/index.js"
compatibility_date = "2026-06-13"

[observability]
enabled = true

[vars]
KHELADEKHO_TARGET_URL = "https://livekhela.tv/"
KICKBD_HOME_URL = "https://kickbd.org"
SIGNATURE_WINDOW_SECONDS = "60"

# Bind a KV namespace for rate limiting and fallback caching
# To use: wrangler kv:namespace create KHELADEKHO_STORE
# [[kv_namespaces]]
# binding = "KHELADEKHO_STORE"
# id = "your-kv-namespace-id"
